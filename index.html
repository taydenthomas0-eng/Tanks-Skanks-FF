<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sacks in the City</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo-mark">🏙️<span>🏈</span></div>
    <div><div class="brand-main">SACKS</div><div class="brand-sub">IN THE CITY</div></div>
  </div>
  <div class="header-right">
    <label class="view-label">VIEW AS
      <select id="managerSelect"></select>
    </label>
    <button id="menuBtn" class="icon-btn">☰</button>
  </div>
</header>

<nav class="nav" id="nav">
  <button class="active" data-tab="dashboard">⌂ <span>DASHBOARD</span></button>
  <button data-tab="weekly">▣ <span>WEEKLY</span></button>
  <button data-tab="transactions">↔ <span>TRANSACTIONS</span></button>
  <button data-tab="managers">♟ <span>MANAGERS</span></button>
  <button data-tab="standings">🏆 <span>STANDINGS</span></button>
  <button data-tab="rivalries">⚔ <span>RIVALRIES</span></button>
  <button data-tab="playoffs">◈ <span>PLAYOFFS</span></button>
  <button data-tab="draft">▤ <span>DRAFT</span></button>
  <button data-tab="awards">★ <span>AWARDS</span></button>
  <button data-tab="rules">☷ <span>RULES</span></button>
</nav>

<div class="ticker"><b>● LIVE</b><span id="tickerText">Loading league data…</span><span>◆</span></div>
<main id="app"></main>

<footer>
  <div class="footer-brand">SACKS <small>IN THE CITY</small></div>
  <div>Built for ballers. Run the city.</div>
  <div class="social">◎ ◉ 𝕏</div>
</footer>

<script src="/assets/app.js"></script>
</body>
</html>
